<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyFlash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <a class="nav-brand" onclick="navigate('home')">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="3"/>
        <path d="M8 21h8M12 17v4"/>
      </svg>
      StudyFlash
    </a>
    <div style="display:flex;align-items:center;gap:.75rem">
      <button class="btn btn-ghost btn-sm" onclick="navigate('public')">Public Sets</button>
      <button class="btn btn-primary" onclick="navigate('create')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Set
      </button>
    </div>
  </nav>

  <main id="app"></main>

  <!-- Share modal -->
  <div id="share-overlay" class="overlay hidden" onclick="closeShare()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Share Flashcard Set</h3>
        <button class="icon-btn" onclick="closeShare()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="modal-body-text">Anyone with this link can view and study your flashcard set.</p>
      <div class="share-url-box">
        <input id="share-url-input" type="text" readonly />
        <button class="btn btn-primary" onclick="copyShareUrl()">Copy</button>
      </div>
      <p id="copy-feedback" class="copy-feedback hidden">Copied to clipboard!</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Confirm delete modal -->
  <div id="delete-overlay" class="overlay hidden" onclick="closeDeleteModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Delete Set</h3>
      </div>
      <p class="modal-body-text">Are you sure you want to delete <strong id="delete-set-name"></strong>? This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
